name: Package Extension

on:
  push:
    tags:
      - 'v*' # Triggered on version tags (e.g., v1.0.0)
  workflow_dispatch: # Manual trigger button

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build & Zip Extension
        run: bun run package

      # 1. Always save the zip as an artifact (Available for download in the Actions UI)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-tab-extension
          path: new-tab-extension.zip
          retention-days: 7

      # 2. Only create a GitHub Release if this was triggered by a tag
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: new-tab-extension.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
